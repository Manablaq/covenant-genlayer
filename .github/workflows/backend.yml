name: Covenant backend deterministic gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deterministic-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned toolchain
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify repository and source bindings
        run: python scripts/verify_backend.py
      - name: Compile Python sources
        run: python -m compileall -q contracts tests scripts
      - name: Direct Mandates tests
        env:
          COVENANT_REPO: ${{ github.workspace }}
          GENVM_VERSION: v0.2.16
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q tests/test_covenant_mandates_direct.py
      - name: GLSim Authorization tests
        env:
          COVENANT_REPO: ${{ github.workspace }}
          GENVM_VERSION: v0.2.16
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q tests/test_covenant_authorization_glsim.py
      - name: GLSim adversarial and runtime-calldata tests
        env:
          COVENANT_REPO: ${{ github.workspace }}
          GENVM_VERSION: v0.2.16
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -q tests/test_covenant_authorization_adversarial.py
          pytest -q tests/test_covenant_authorization_runtime_calldata.py
          pytest -q tests/test_covenant_gate_d_closure_glsim.py
      - name: Pure canonicalization and closure vectors
        env:
          COVENANT_REPO: ${{ github.workspace }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q tests/test_covenant_gate_d_closure_vectors.py tests/test_covenant_reference_vectors.py
      - name: Confirm clean generated state
        run: git restore -- artifacts/.gitkeep && git diff --check && test -z "$(git status --porcelain)"
